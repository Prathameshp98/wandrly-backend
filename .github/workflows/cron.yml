# External scheduler. TECHNICAL_DESIGN §10.2.
#
# A free Koyeb instance can sleep, so in-process cron would silently stop
# firing — including the nightly ledger reconciliation, the one job that must
# never stop. GitHub Actions runs regardless of the container's state, and
# emails on failure, which is the entire cron monitoring setup.
name: Scheduled tasks

on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST — fx, reconcile, purges
    - cron: '0 * * * *'     # hourly — notification digest sweep
  workflow_dispatch:
    inputs:
      group:
        description: Task group
        type: choice
        options: [daily, hourly, frequent]
        default: daily

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Determine group
        id: group
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 20 * * *" ]; then
            echo "value=daily" >> "$GITHUB_OUTPUT"
          else
            echo "value=hourly" >> "$GITHUB_OUTPUT"
          fi

      - name: Enqueue background work
        run: |
          curl -fsS -X POST "${API_URL}/internal/cron/tick" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            -d "{\"group\":\"${{ steps.group.outputs.value }}\"}" \
            --max-time 120 --retry 3 --retry-connrefused
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
